<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Community Post — Design Express Admin</title>
</head>
<body style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:32px 16px;background:#f4f4f4 url('https://example.com/icon-email-bg.jpg') no-repeat center center;background-size:350px auto;">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #e0e0e0;max-width:560px;width:100%;">

          <tr>
            <td style="background:#1a1205;padding:22px 32px;text-align:center;">
              <h1 style="margin:0;color:#C49A28;font-size:20px;letter-spacing:2px;font-weight:700;font-family:Arial,Helvetica,sans-serif;">Design Express</h1>
            </td>
          </tr>
          <tr><td><div style="height:3px;background:#C49A28;"></div></td></tr>

          <tr>
            <td style="padding:32px 40px 8px;">
              <h2 style="margin:0 0 4px;font-size:20px;color:#111111;font-family:Arial,Helvetica,sans-serif;">New Community Post</h2>
              <div style="height:2px;width:40px;background:#C49A28;margin:10px 0 20px;"></div>
            </td>
          </tr>

          <tr>
            <td style="padding:0 40px 36px;">
              <p style="margin:0 0 20px;font-size:15px;color:#333333;line-height:1.7;">
                A new post was published in the community on <strong>{{.PostedAt}}</strong>.
              </p>

              <table width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #eeeeee;">
                <tr style="background:#f9f9f9;">
                  <td style="padding:11px 16px;font-size:13px;color:#888888;width:32%;vertical-align:top;border-bottom:1px solid #eeeeee;">Author</td>
                  <td style="padding:11px 16px;font-size:14px;color:#333333;text-align:right;border-bottom:1px solid #eeeeee;">{{.Author}}</td>
                </tr>
                <tr>
                  <td style="padding:11px 16px;font-size:13px;color:#888888;vertical-align:top;border-bottom:1px solid #eeeeee;">Category</td>
                  <td style="padding:11px 16px;font-size:14px;color:#333333;text-align:right;border-bottom:1px solid #eeeeee;">{{.Category}}</td>
                </tr>
                <tr style="background:#f9f9f9;">
                  <td style="padding:11px 16px;font-size:13px;color:#888888;vertical-align:top;border-bottom:1px solid #eeeeee;">Title</td>
                  <td style="padding:11px 16px;font-size:14px;color:#333333;text-align:right;border-bottom:1px solid #eeeeee;">{{.Title}}</td>
                </tr>
                <tr>
                  <td style="padding:11px 16px;font-size:13px;color:#888888;vertical-align:top;border-bottom:1px solid #eeeeee;">Content</td>
                  <td style="padding:11px 16px;font-size:14px;color:#333333;text-align:right;border-bottom:1px solid #eeeeee;">{{.Content}}</td>
                </tr>
                <tr style="background:#f9f9f9;">
                  <td style="padding:11px 16px;font-size:13px;color:#888888;vertical-align:top;">Posted</td>
                  <td style="padding:11px 16px;font-size:14px;color:#333333;text-align:right;">{{.PostedAt}}</td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="background:#f9f9f9;border-top:1px solid #eeeeee;padding:16px 40px;text-align:center;">
              <p style="margin:0;font-size:12px;color:#888888;line-height:1.6;">&copy; {{.Year}} Design Express. Admin notification — do not reply.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
