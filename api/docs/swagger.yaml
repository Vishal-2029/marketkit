          $ref: '#/definitions/models.CommunityReply'
        type: array
      reply_count:
        type: integer
      title:
        type: string
      user_email:
        type: string
      user_name:
        description: Populated at query time for admin endpoints only; not stored
          in DB.
        type: string
    type: object
  models.CommunityReply:
    properties:
      anon_name:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
