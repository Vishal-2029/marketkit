        unpaid orders
    x-enum-descriptions:
    - unused by Learning; reused by MarketPlanSubscription for unpaid orders
    - ""
    - ""
    - ""
    - ""
    x-enum-varnames:
    - SubscriptionPending
    - SubscriptionActive
    - SubscriptionExpired
    - SubscriptionSuspended
    - SubscriptionCancelled
  models.User:
    properties:
      avatar_url:
        type: string
      current_app_mode:
        description: |-
          CurrentAppMode is the dual-mode app's active side for this user:
          "" (legacy accounts predating this feature), "learning", or "market".
          Set at registration now that mode is chosen before signup; changed later
          only via the explicit mode-switch endpoint.
        type: string
      email:
        type: string
      id:
        type: string
      joined_at:
        type: string
      learning_joined_at:
        type: string
      market_joined_at:
        type: string
      name:
        type: string
      payments:
        items:
          $ref: '#/definitions/models.Payment'
        type: array
      phone:
        type: string
      playback_logs:
        items:
          $ref: '#/definitions/models.PlaybackLog'
        type: array
      sessions:
        items:
          $ref: '#/definitions/models.UserSession'
        type: array
      status:
        $ref: '#/definitions/models.UserStatus'
      subscriptions:
        items:
          $ref: '#/definitions/models.Subscription'
        type: array
      updated_at:
        type: string
      wallet_balance_in_paise:
        description: |-
          Cached wallet balance; source of truth is the wallet_transactions ledger.
