          in DB.
        type: string
      created_at:
        type: string
      currency:
        type: string
      product:
        $ref: '#/definitions/models.Product'
      product_id:
        type: string
      product_title:
        type: string
      id:
        type: string
      paid_at:
        type: string
      razorpay_order_id:
        type: string
      razorpay_payment_id:
        type: string
      status:
        $ref: '#/definitions/models.PaymentStatus'
