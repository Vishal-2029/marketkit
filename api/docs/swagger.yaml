      is_free:
        type: boolean
      is_intro:
        type: boolean
      is_preview:
        type: boolean
      lqip:
        type: string
      mp4_size_240p:
        type: integer
      mp4_size_360p:
        type: integer
      mp4_size_480p:
        type: integer
      mp4_size_720p:
        type: integer
      mp4_size_1080p:
        type: integer
      playback_logs:
        items:
          $ref: '#/definitions/models.PlaybackLog'
        type: array
      preview_url:
        type: string
      status:
        $ref: '#/definitions/models.VideoStatus'
      thumbnail_url:
        type: string
      title:
        type: string
      transcode_error:
        type: string
      transcode_finished_at:
        type: string
      transcode_started_at:
        description: Transcode timing, shown in the admin panel (how long each video
          took).
        type: string
      updated_at:
        type: string
      uploaded_at:
        type: string
    type: object
  models.VideoCategory:
    enum:
    - CATEGORY_A
    - CATEGORY_B
    - CATEGORY_C
    type: string
    x-enum-varnames:
    - CategoryA
    - CategoryB
    - CategoryC
  models.VideoComment:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      thread_user_id:
        description: |-
          ThreadUserID identifies which end user's private conversation this row
          belongs to. For a user-authored row it equals UserID. For an
          admin-authored reply, UserID is the "admin" sentinel while
          ThreadUserID is the target user — so a single
          Where("thread_user_id = ?") query returns a user's own messages plus
          admin's replies to them, never another user's rows.
        type: string
      user_name:
        type: string
      video_id:
        type: string
