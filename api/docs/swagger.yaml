        type: integer
      balance_after_in_paise:
        type: integer
      created_at:
        type: string
      id:
        type: string
      metadata:
        $ref: '#/definitions/models.JSONMap'
      reference_id:
        type: string
      source:
        type: string
      type:
        type: string
    type: object
  models.PlaybackLog:
