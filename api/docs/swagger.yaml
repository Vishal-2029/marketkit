        type: string
      expiry_date:
        type: string
      id:
        type: string
      paid_at:
        type: string
      plan:
        $ref: '#/definitions/models.MarketPlan'
      plan_id:
        type: string
      razorpay_order_id:
        type: string
      razorpay_payment_id:
        type: string
      start_date:
        type: string
