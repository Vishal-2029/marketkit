  models.Payment:
    properties:
      amount_in_paise:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      gateway:
        $ref: '#/definitions/models.PaymentGateway'
      gateway_response:
        $ref: '#/definitions/models.JSONMap'
