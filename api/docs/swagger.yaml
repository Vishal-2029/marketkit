      id:
        type: string
      is_active:
        type: boolean
      is_mine:
        type: boolean
      is_purchased:
        type: boolean
      preview_urls:
        items:
          type: string
        type: array
      price_in_paise:
        type: integer
      sales_count:
        type: integer
      seller_email:
        type: string
