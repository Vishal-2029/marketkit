    - UserStatusSuspended
    - UserStatusExpired
  models.Video:
    properties:
      category:
        $ref: '#/definitions/models.VideoCategory'
      description:
        type: string
      duration_seconds:
        type: integer
      has_hls:
        description: |-
          Safe "is transcoded" flag for clients — HLSKey itself is never
          serialized (raw storage key), so the admin UI needs this to know
