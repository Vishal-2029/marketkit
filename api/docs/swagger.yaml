          DB.
        type: string
      video_id:
        type: string
    type: object
  models.PhotoCategory:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.Plan:
    properties:
      created_at:
        type: string
      description:
        type: string
      duration_days:
        type: integer
      has_e4:
        type: boolean
      has_mecad:
        type: boolean
      has_willcom:
        type: boolean
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price_in_paise:
