      video_id:
        type: string
      watched_seconds:
        type: integer
      watermark_id:
        type: string
    type: object
  models.Subscription:
    properties:
      activated_by:
        type: string
      created_at:
        type: string
      expiry_date:
        type: string
      expiry_warning_sent:
        type: boolean
      id:
        type: string
      plan:
        $ref: '#/definitions/models.Plan'
      plan_id:
        type: string
      start_date:
        type: string
      status:
        $ref: '#/definitions/models.SubscriptionStatus'
      updated_at:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: string
    type: object
  models.SubscriptionStatus:
    enum:
    - ACTIVE
    - EXPIRED
    - SUSPENDED
    - CANCELLED
    type: string
    x-enum-varnames:
    - SubscriptionActive
    - SubscriptionExpired
    - SubscriptionSuspended
    - SubscriptionCancelled
  models.User:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      id:
        type: string
      joined_at:
        type: string
      name:
        type: string
      payments:
        items:
          $ref: '#/definitions/models.Payment'
        type: array
      phone:
        type: string
      playback_logs:
        items:
          $ref: '#/definitions/models.PlaybackLog'
        type: array
      sessions:
        items:
          $ref: '#/definitions/models.UserSession'
        type: array
      status:
        $ref: '#/definitions/models.UserStatus'
      subscriptions:
        items:
          $ref: '#/definitions/models.Subscription'
        type: array
      updated_at:
        type: string
    type: object
  models.UserSession:
    properties:
      created_at:
        type: string
      device_info:
        type: string
      id:
        type: string
      ip_address:
        type: string
      last_active_at:
        type: string
      location:
        type: string
      revoked_at:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: string
    type: object
  models.UserStatus:
    enum:
    - ACTIVE
    - SUSPENDED
    - EXPIRED
    type: string
    x-enum-varnames:
    - UserStatusActive
    - UserStatusSuspended
    - UserStatusExpired
  models.Video:
    properties:
      category:
        $ref: '#/definitions/models.VideoCategory'
      description:
        type: string
      duration_seconds:
        type: integer
      file_key:
        type: string
      hls_key:
        type: string
      id:
        type: string
      is_free:
        type: boolean
      is_intro:
        type: boolean
      is_preview:
        type: boolean
      lqip:
        type: string
      mp4_key_240p:
        type: string
      mp4_key_360p:
        type: string
      mp4_key_480p:
        type: string
      mp4_key_720p:
        type: string
      mp4_key_1080p:
        type: string
      mp4_size_240p:
        type: integer
      mp4_size_360p:
        type: integer
      mp4_size_480p:
        type: integer
      mp4_size_720p:
        type: integer
      mp4_size_1080p:
        type: integer
      playback_logs:
        items:
          $ref: '#/definitions/models.PlaybackLog'
        type: array
      preview_url:
        type: string
      status:
        $ref: '#/definitions/models.VideoStatus'
      thumbnail_url:
        type: string
      title:
        type: string
      transcode_error:
        type: string
      updated_at:
        type: string
      uploaded_at:
        type: string
    type: object
  models.VideoCategory:
    enum:
    - WILLCOM
    - E4
    - MECAD
    type: string
    x-enum-varnames:
    - CategoryWillcom
    - CategoryE4
    - CategoryMecad
  models.VideoComment:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      thread_user_id:
        description: |-
          ThreadUserID identifies which end user's private conversation this row
          belongs to. For a user-authored row it equals UserID. For an
          admin-authored reply, UserID is the "admin" sentinel while
          ThreadUserID is the target user — so a single
          Where("thread_user_id = ?") query returns a user's own messages plus
          admin's replies to them, never another user's rows.
        type: string
      user_name:
        type: string
      video_id:
        type: string
    type: object
  models.VideoProgress:
    properties:
      position_seconds:
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
      video_id:
        type: string
    type: object
  models.VideoStatus:
    enum:
    - DRAFT
    - PROCESSING
    - PUBLISHED
    - ERROR
    type: string
    x-enum-varnames:
    - VideoStatusDraft
    - VideoStatusProcessing
    - VideoStatusPublished
    - VideoStatusError
  plans.planWithStats:
    properties:
      created_at:
        type: string
      description:
        type: string
      duration_days:
        type: integer
      has_e4:
        type: boolean
      has_mecad:
        type: boolean
      has_willcom:
        type: boolean
      id:
