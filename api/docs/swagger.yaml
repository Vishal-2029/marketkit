  models.Withdrawal:
    properties:
      amount_in_paise:
        type: integer
      bank_account_number:
        type: string
      bank_holder_name:
        type: string
      bank_ifsc:
        type: string
      created_at:
        type: string
      id:
        type: string
      method:
        type: string
      note:
        type: string
      settled_at:
        type: string
      settled_by:
        type: string
      status:
        type: string
      upi_id:
        description: Payout destination snapshotted at request time.
        type: string
      user_email:
        type: string
      user_name:
        description: Populated at query time for admin endpoints only; not stored
          in DB.
        type: string
    type: object
  plans.planWithStats:
    properties:
      created_at:
        type: string
      description:
        type: string
      duration_days:
        type: integer
      features:
        description: |-
          Features lists the feature keys this plan grants. A user's entitlements
          are the union of Features across all their active subscriptions, so
          à-la-carte plans ("A only", "A + B") and ladder tiers both work without
          a schema change — which is why this is a list rather than a tier number.

          Keys are free-form strings you define. The kit ships with the video
          category keys from VideoCategory (CATEGORY_A/B/C) so that content gating
          works out of the box: a video is unlocked when its Category appears in
          the viewer's feature set. Add your own keys for anything else you sell.
        items:
          type: string
        type: array
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price_in_paise:
        type: integer
      subscribers:
        type: integer
      updated_at:
        type: string
    type: object
  user_auth.registerRequest:
    properties:
      email:
        type: string
      mode:
        description: |-
          Mode is the app mode chosen before registration ("learning" or
          "market") — the mode chooser now runs before the register form.
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  user_auth.sendOTPRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  user_auth.verifyOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    type: object
  user_videos.videoWithAccess:
    properties:
      accessible:
        type: boolean
      category:
        $ref: '#/definitions/models.VideoCategory'
      description:
        type: string
      duration_seconds:
        type: integer
      has_hls:
        description: |-
          Safe "is transcoded" flag for clients — HLSKey itself is never
          serialized (raw storage key), so the admin UI needs this to know
          whether the HLS ladder exists. Set by the AfterFind hook.
        type: boolean
      id:
        type: string
      is_free:
        type: boolean
      is_intro:
        type: boolean
      is_preview:
        type: boolean
      lqip:
        type: string
      mp4_size_240p:
        type: integer
      mp4_size_360p:
        type: integer
      mp4_size_480p:
        type: integer
      mp4_size_720p:
        type: integer
      mp4_size_1080p:
        type: integer
      playback_logs:
        items:
          $ref: '#/definitions/models.PlaybackLog'
        type: array
      preview_url:
        type: string
      progress_seconds:
        type: integer
      status:
        $ref: '#/definitions/models.VideoStatus'
      thumbnail_url:
        type: string
      title:
        type: string
      transcode_error:
        type: string
      transcode_finished_at:
        type: string
      transcode_started_at:
        description: Transcode timing, shown in the admin panel (how long each video
          took).
        type: string
      updated_at:
        type: string
      uploaded_at:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@example.com
    name: MarketKit
  description: REST API for the MarketKit marketplace platform. Admin routes require
    a Bearer JWT token. User routes require a separate User Bearer JWT token.
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: MarketKit API
  version: "1.0"
paths:
  /admin/notifications:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AdminAuth: []
      summary: Delete all notifications from history (admin)
      tags:
      - Admin Notifications
    get:
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AdminAuth: []
      summary: List sent notification logs (admin)
      tags:
      - Admin Notifications
  /admin/notifications/{id}:
    delete:
      parameters:
      - description: Notification log ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AdminAuth: []
      summary: Delete a single notification from history (admin)
      tags:
      - Admin Notifications
  /admin/notifications/broadcast:
    post:
      consumes:
      - application/json
      parameters:
      - description: title, message, optional plan_id and sub_status
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
