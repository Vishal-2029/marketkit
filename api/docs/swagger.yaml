        type: boolean
      file_format:
        type: string
      file_name:
        type: string
      file_size_bytes:
        type: integer
      id:
        type: string
      is_active:
        type: boolean
      is_mine:
        type: boolean
      is_purchased:
        type: boolean
      preview_urls:
        items:
          type: string
        type: array
      price_in_paise:
        type: integer
      sales_count:
        type: integer
      seller_email:
        type: string
      seller_name:
        description: Populated at query time; not stored in DB.
        type: string
      title:
        type: string
      updated_at:
        type: string
      view_count:
