      id:
        type: string
      paid_at:
        type: string
      paid_via:
        type: string
      product:
        $ref: '#/definitions/models.Product'
      product_id:
        type: string
      product_title:
        type: string
      razorpay_order_id:
        type: string
      razorpay_payment_id:
        type: string
      seller:
        $ref: '#/definitions/models.User'
      seller_email:
        type: string
      seller_name:
        type: string
      seller_net_in_paise:
        type: integer
      status:
        $ref: '#/definitions/models.PaymentStatus'
    type: object
  models.ProductPurchaseMessage:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      purchase_id:
        type: string
      thread_user_id:
        type: string
      user_name:
        type: string
    type: object
  models.Subscription:
