<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MarketKit — marketplace starter kit.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MarketKit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MarketKit</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #fl-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #F9F7F3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.4s ease;
    }
    .fl-spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid rgba(191, 155, 111, 0.2);
      border-top-color: #BF9B6F;
      animation: fl-spin 0.9s linear infinite;
    }
    @keyframes fl-spin {
      to { transform: rotate(360deg); }
    }
    .fl-label {
      font-family: sans-serif;
      font-size: 16px;
      color: #1C1C22;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
