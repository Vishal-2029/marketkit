name: marketkit
description: "MarketKit — Go + Flutter + React marketplace starter kit."
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3

  # Secure storage (auth tokens)
  flutter_secure_storage: ^9.2.2

  # Video playback — better_player_plus wraps ExoPlayer/AVPlayer with native
  # HLS adaptive streaming, quality/speed menus, and fullscreen handling.
  better_player_plus: ^1.0.8
  # Screen brightness control for the left-half vertical-swipe gesture.
  screen_brightness: ^2.1.2

  # Payments
  razorpay_flutter: ^1.3.7
  flutter_stripe: ^11.5.0

  # Push notifications (requires google-services.json in android/app/)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  flutter_local_notifications: ^17.2.2
  app_settings: ^5.1.1

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Profile utilities
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.0
  image_cropper: ^8.0.2
  file_picker: ^8.1.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0
  connectivity_plus: ^7.1.1

  # Save photos to the device gallery
  gal: ^2.3.0
  flutter_cache_manager: ^3.3.1

  # Offline encrypted video downloads (app-private storage)
  path_provider: ^2.1.4
  pointycastle: ^3.9.1

  # In-app APK update installer (sideloaded builds)
  open_filex: ^4.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
  macos:
    generate: true
    image_path: "assets/icon.png"
  image_path: "assets/icon.png"
  remove_alpha_ios: true
